name: Build and publish releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux installer and portable build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
      - name: Build Atlas
        run: cargo build --release --locked
      - name: Package Linux release
        run: |
          mkdir -p dist/linux
          cp target/release/atlas-client dist/linux/atlas-client
          cp packaging/linux/install.sh packaging/linux/uninstall.sh dist/linux/
          cp README.md dist/linux/README.md
          tar -czf atlas-client-linux-x86_64.tar.gz -C dist/linux .
          cp packaging/linux/online-install.sh atlas-client-linux-install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            atlas-client-linux-x86_64.tar.gz
            atlas-client-linux-install.sh
          if-no-files-found: error

  windows:
    name: Windows setup and portable build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Atlas
        run: cargo build --release --locked
      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows, dist/portable | Out-Null
          Copy-Item target/release/atlas-client.exe dist/windows/atlas-client.exe
          Copy-Item target/release/atlas-client.exe dist/portable/atlas-client.exe
          Copy-Item packaging/windows/uninstall.ps1 dist/windows/uninstall.ps1
          Copy-Item README.md dist/portable/README.md
          Compress-Archive -Path dist/portable/* -DestinationPath atlas-client-windows-x86_64.zip -Force
          choco install innosetup --yes --no-progress
          $env:ATLAS_VERSION = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Datlas .\packaging\windows\atlas.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler exited with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            atlas-client-windows-x86_64.zip
            dist/windows/atlas-client-windows-x86_64-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release-assets
      - name: Create release and upload installers
        run: |
          cd release-assets
          sha256sum atlas-client-linux-x86_64.tar.gz atlas-client-windows-x86_64.zip atlas-client-windows-x86_64-setup.exe > SHA256SUMS
          cd ..
        shell: bash
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Atlas ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Atlas is an early preview. Includes installable and portable downloads for Windows and Linux. Windows setup adds a Start Menu shortcut and supports in-app updates. Linux includes an online installer and portable archive.

            Microsoft sign-in, Java runtime setup, and launching Minecraft are still in development.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*
